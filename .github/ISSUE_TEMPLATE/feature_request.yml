name: Feature request
description: Suggest an idea or improvement for mp3tom4
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first, then the solution.
        （感谢建议，请先说明要解决的问题，再描述期望方案。）

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is painful or missing today? Is your request related to a frustration?
      placeholder: I batch 200 files per day and have to re-pick the output folder every time...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
    validations:
      required: false
